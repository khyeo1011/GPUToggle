<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fff;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #e5e5e5;
    }
    header h1 { font-size: 15px; font-weight: 600; }
    .main { padding: 20px 16px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
    .label { font-weight: 500; }
    .sublabel { font-size: 12px; color: #666; margin-top: 2px; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #ccc; border-radius: 26px;
      cursor: pointer; transition: background 0.2s;
    }
    .slider:before {
      content: "";
      position: absolute;
      width: 20px; height: 20px;
      left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #1a73e8; }
    input:checked + .slider:before { transform: translateX(22px); }
    input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

    /* Relaunch banner */
    #banner {
      display: none;
      margin: 0 16px 16px;
      padding: 12px;
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }
    #banner p { font-size: 13px; margin-bottom: 10px; color: #333; }
    .btn-row { display: flex; gap: 8px; }
    button {
      flex: 1; padding: 7px 0; border: none; border-radius: 4px;
      font-size: 13px; cursor: pointer;
    }
    #btn-relaunch { background: #1a73e8; color: #fff; }
    #btn-relaunch:hover { background: #1558b0; }
    #btn-later { background: #f1f3f4; color: #333; }
    #btn-later:hover { background: #e2e5e8; }

    /* Error */
    #error {
      display: none;
      margin: 0 16px 16px;
      padding: 10px 12px;
      background: #fce8e6;
      border-radius: 6px;
      font-size: 13px;
      color: #c5221f;
    }
  </style>
</head>
<body>
  <header>
    <h1>GPU Toggle</h1>
  </header>

  <div class="main">
    <div class="row">
      <div>
        <div class="label">Hardware Acceleration</div>
        <div class="sublabel" id="state-label">Loading…</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle" disabled>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div id="banner">
    <p>Setting changed. Chrome must relaunch to apply.</p>
    <div class="btn-row">
      <button id="btn-relaunch">Relaunch now</button>
      <button id="btn-later">Later</button>
    </div>
  </div>

  <div id="error"></div>

  <script src="popup.js"></script>
</body>
</html>
